name: Wind-Alarm

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
    inputs:
      test:
        description: "Auch ohne Kitefenster eine Testnachricht senden"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Vorhersage prüfen und Push senden
        run: node alarm.mjs
        env:
          FORCE: ${{ inputs.test }}
